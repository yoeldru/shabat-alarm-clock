# Written: 2026-10-29 21:30, updated 2026-10-30 00:00 (Asia/Jerusalem)
# Builds a signed APK on every push to main and publishes it as the latest GitHub Release.
# Download link (always the newest build):
# https://github.com/yoeldru/shabat-alarm-clock/releases/latest/download/shabat-alarm-clock.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK + write version.json (read by the in-app updater)
        run: |
          cp app/build/outputs/apk/release/app-release.apk shabat-alarm-clock.apk
          jq -n --argjson code ${{ github.run_number }} \
                --arg name "1.0.${{ github.run_number }}" \
                --rawfile notes release-notes.txt \
                '{versionCode: $code, versionName: $name, notes: ($notes | rtrimstr("\n"))}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: shabat-alarm-clock
          path: shabat-alarm-clock.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: שעון מעורר לשבת 1.0.${{ github.run_number }}
          body_path: release-notes.txt
          files: |
            shabat-alarm-clock.apk
            version.json
          make_latest: true
